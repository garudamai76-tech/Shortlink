<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHORTCRT - URL Shortener</title>
  <style>
    body { font-family: sans-serif; background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px 0; color: #f8fafc; }
    .card { background: #1e293b; padding: 2rem; border-radius: 16px; width: 100%; max-width: 450px; border: 1px solid #334155; box-sizing: border-box; }
    h2 { text-align: center; color: #38bdf8; margin-top: 0; margin-bottom: 1.5rem; }
    .menu-tabs { display: flex; gap: 10px; margin-bottom: 1.2rem; }
    .btn-tab { flex: 1; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #94a3b8; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-tab.active { background: #3b82f6; color: white; border-color: #3b82f6; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: #94a3b8; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 0.8rem; margin-bottom: 1.2rem; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; box-sizing: border-box; outline: none; }
    textarea { resize: vertical; min-height: 90px; }
    .main-btn { width: 100%; padding: 0.9rem; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .main-btn:hover { background: #2563eb; }
    #resultBox { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; display: none; word-break: break-all; }
    .box-success { background: #064e3b; color: #ecfdf5; border: 1px solid #059669; }
    .box-error { background: #7f1d1d; color: #fef2f2; border: 1px solid #dc2626; }
    .link-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }
    a.link-url { color: #38bdf8; font-weight: bold; text-decoration: none; }
    .btn-copy { background: #334155; border: none; padding: 4px 10px; border-radius: 4px; color: #f8fafc; cursor: pointer; font-size: 0.75rem; flex-shrink: 0; margin-left: 8px; }
    .btn-copy-all { background: #059669; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; width: 100%; }
    .btn-copy-all:hover { background: #047857; }
  </style>
</head>
<body>
  <div class="card" id="appContainer">
    
    <!-- KOTAK LOGIN PASSWORD -->
    <div id="loginBox">
      <h2>SHORTCRT Login</h2>
      <label>Masukkan Password Akses</label>
      <input type="password" id="inputPassword" placeholder="Password...">
      <button class="main-btn" onclick="cekPassword()">Masuk</button>
      <div id="loginError" style="color: #fca5a5; font-size: 0.85rem; margin-top: 10px; text-align: center; display: none;">Password salah!</div>
    </div>

    <!-- PANEL UTAMA -->
    <div id="appMain" style="display: none;">
      <h2>SHORTCRT</h2>
      
      <div class="menu-tabs">
        <div id="tSingle" class="btn-tab active" onclick="changeTab('single')">🔗 Single URL</div>
        <div id="tBulk" class="btn-tab" onclick="changeTab('bulk')">📦 Bulk URL</div>
      </div>

      <label>Pilih Domain</label>
      <select id="domainChoice">
        <option value="">Domain Utama (GitHub)</option>
        <option value="mon.croot.site">mon.croot.site</option>
        <option value="aspn.croot.site">aspn.croot.site</option>
        <option value="go.croot.site">go.croot.site</option>
      </select>

      <div id="formSingle">
        <label>Custom Alias (Opsional)</label>
        <input type="text" id="inputAlias" placeholder="alias-unik">
        <label>Paste Long URL</label>
        <input type="url" id="inputUrl" placeholder="https://...">
      </div>

      <div id="formBulk" style="display: none;">
        <label>Paste Long URLs (1 URL per baris)</label>
        <textarea id="inputBulkUrls" placeholder="https://contoh.com/1&#10;https://contoh.com/2"></textarea>
      </div>

      <button class="main-btn" onclick="generateLink()">Create Link</button>
      <div id="resultBox"></div>
    </div>

  </div>

  <script>
    const passwordSaya = "Bobby12345"; // Ubah password di sini jika ingin

    function cekPassword() {
      const passVal = document.getElementById('inputPassword').value;
      const errBox = document.getElementById('loginError');

      if (passVal === passwordSaya) {
        sessionStorage.setItem('shortcrt_logged', 'true');
        tampilkanAplikasi();
      } else {
        errBox.style.display = 'block';
      }
    }

    function tampilkanAplikasi() {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('appMain').style.display = 'block';
    }

    let modeAktif = 'single';

    function changeTab(tipe) {
      modeAktif = tipe;
      document.getElementById('tSingle').className = tipe === 'single' ? 'btn-tab active' : 'btn-tab';
      document.getElementById('tBulk').className = tipe === 'bulk' ? 'btn-tab active' : 'btn-tab';
      document.getElementById('formSingle').style.display = tipe === 'single' ? 'block' : 'none';
      document.getElementById('formBulk').style.display = tipe === 'bulk' ? 'block' : 'none';
      document.getElementById('resultBox').style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', () => {
      const hashKey = window.location.hash.substring(1);
      
      if (hashKey) {
        const dataSimpan = localStorage.getItem('SHORTLINK_' + hashKey);
        if (dataSimpan) {
          let tujuanUrl = dataSimpan;
          try {
            const parsed = JSON.parse(dataSimpan);
            tujuanUrl = parsed.longUrl || dataSimpan;
          } catch(e) {}

          const adList = [
            "https://www.profitableratecpmnetwork.com/hh55phupz7?key=035891703dff41ba6e0911050a5989a"
          ];
          const pilihIklan = adList[Math.floor(Math.random() * adList.length)];
          
          const scr = document.createElement('script');
          scr.src = pilihIklan;
          document.head.append(scr);

          document.getElementById('appContainer').innerHTML = `
            <div style="text-align: center;">
              <h3 style="color: #f8fafc; margin-bottom: 10px;">Menyiapkan Tautan Anda...</h3>
              <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;">Silakan tunggu sebentar...</p>
              <a id="btnLanjut" href="#" style="display: block; width: 100%; padding: 12px; background: #3b82f6; color: white; border-radius: 8px; font-weight: bold; text-decoration: none;">
                Lanjutkan ke Tujuan (<span id="hitungMundur">3</span>)
              </a>
            </div>
          `;

          let sisaWaktu = 3;
          const elHitung = document.getElementById('hitungMundur');
          const elBtn = document.getElementById('btnLanjut');

          const tInterval = setInterval(() => {
            sisaWaktu--;
            if (sisaWaktu > 0) {
              elHitung.textContent = sisaWaktu;
            } else {
              clearInterval(tInterval);
              elHitung.parentElement.textContent = "Klik Disini untuk Melanjutkan";
            }
          }, 1000);

          elBtn.addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = tujuanUrl;
          });
        }
        return;
      }

      if (sessionStorage.getItem('shortcrt_logged') === 'true') {
        tampilkanAplikasi();
      }
    });

    function generateLink() {
      const domPilihan = document.getElementById('domainChoice').value;
      const boxRes = document.getElementById('resultBox');
      boxRes.style.display = 'none';

      let baseDomain = domPilihan ? (domPilihan.startsWith('http') ? domPilihan : 'https://' + domPilihan) : window.location.origin + window.location.pathname;
      baseDomain = baseDomain.replace(/\/$/, '');

      if (modeAktif === 'single') {
        const urlAsli = document.getElementById('inputUrl').value.trim();
        const aliasCustom = document.getElementById('inputAlias').value.trim();

        if (!urlAsli) {
          boxRes.className = 'box-error';
          boxRes.style.display = 'block';
          boxRes.textContent = "Masukkan URL terlebih dahulu!";
          return;
        }

        let aliasFinal = aliasCustom ? aliasCustom.replace(/\s+/g, '-') : Math.random().toString(36).substring(2, 8);
        localStorage.setItem('SHORTLINK_' + aliasFinal, urlAsli);
        let hasilShort = baseDomain + '/#' + aliasFinal;

        boxRes.className = 'box-success';
        boxRes.style.display = 'block';
        boxRes.innerHTML = `
          <div style="margin-bottom: 5px; font-weight: bold;">Berhasil Dibuat:</div>
          <div class="link-row">
            <a class="link-url" href="${hasilShort}" target="_blank">${hasilShort}</a>
            <button class="btn-copy" onclick="navigator.clipboard.writeText('${hasilShort}')">Copy</button>
          </div>
        `;
      } else {
        const teksBulk = document.getElementById('inputBulkUrls').value.trim();
        if (!teksBulk) {
          boxRes.className = 'box-error';
          boxRes.style.display = 'block';
          boxRes.textContent = "Masukkan daftar URL (1 URL per baris)!";
          return;
        }

        const barisList = teksBulk.split('\n');
        let daftarHasilArray = [];
        let htmlRakit = '<div style="margin-bottom: 8px; font-weight: bold;">Daftar Berhasil Dibuat:</div>';
        let totalSukses = 0;

        barisList.forEach(baris => {
          let u = baris.trim();
          if (u) {
            let aliasRandom = Math.random().toString(36).substring(2, 8);
            localStorage.setItem('SHORTLINK_' + aliasRandom, u);
            let hasilShort = baseDomain + '/#' + aliasRandom;
            
            daftarHasilArray.push(hasilShort);
            htmlRakit += `
              <div class="link-row">
                <a class="link-url" href="${hasilShort}" target="_blank">${hasilShort}</a>
                <button class="btn-copy" onclick="navigator.clipboard.writeText('${hasilShort}')">Copy</button>
              </div>
            `;
            totalSukses++;
          }
        });

        if (totalSukses > 0) {
          // Gabungkan semua link dengan baris baru (\n) untuk tombol Salin Semua
          const semuaLinkTeks = daftarHasilArray.join('\n');
          
          boxRes.className = 'box-success';
          boxRes.style.display = 'block';
          boxRes.innerHTML = `
            <button class="btn-copy-all" onclick="navigator.clipboard.writeText(\`${semuaLinkTeks}\`)">📋 Salin Semua Link</button>
            ${htmlRakit}
          `;
        }
      }
    }
  </script>
</body>
</html>
